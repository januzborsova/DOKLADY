<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>Moje doklady</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#64748b;--accent:#3b82f6}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:90px}

.header{position:sticky;top:0;z-index:10;background:rgba(15,23,42,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 16px 0}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.header-title{font-size:20px;font-weight:800;letter-spacing:-0.5px}
.header-actions{display:flex;gap:6px}
.btn-sm{background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:border-color .15s,color .15s}
.btn-sm:hover{border-color:var(--accent);color:var(--text)}

.main-tabs{display:flex}
.main-tab{flex:1;text-align:center;padding:10px 0;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.main-tab.active{color:var(--text);border-bottom-color:var(--accent)}

.content{padding:16px}

/* Notification banner */
.notif-banner{margin:0 0 14px;background:linear-gradient(135deg,#1e3a5f,#1e293b);border:1px solid var(--accent);border-radius:14px;padding:13px 16px;display:flex;align-items:center;gap:12px}
.notif-banner-text{flex:1;font-size:13px;color:#93c5fd}
.notif-banner-text strong{color:var(--text);display:block;font-size:14px;margin-bottom:2px}
.btn-notif{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-close-banner{background:transparent;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 2px}

.summary{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sum-chip{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:600;color:var(--muted)}

.owners{display:flex;flex-direction:column;gap:10px}
.owner-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

.owner-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;user-select:none;gap:8px}
.owner-header-left{display:flex;align-items:center;gap:10px}
.owner-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.owner-name{font-weight:700;font-size:15px}
.owner-meta{font-size:12px;color:var(--muted);margin-top:2px}
.owner-header-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.chevron{font-size:11px;color:var(--muted);transition:transform .2s;display:inline-block}
.chevron.open{transform:rotate(180deg)}

.owner-docs{border-top:1px solid var(--border)}
.owner-doc{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid rgba(51,65,85,0.5);gap:8px}
.owner-doc:last-child{border-bottom:none}
.doc-left{display:flex;align-items:center;gap:10px}
.doc-icon{font-size:20px}
.doc-name{font-size:14px;font-weight:600}
.doc-notes{font-size:11px;color:var(--muted);margin-top:1px}
.doc-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.badge{display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.badge-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.doc-date{font-size:11px;color:var(--muted)}
.doc-actions{display:flex;gap:2px}
.btn-icon{background:transparent;border:none;cursor:pointer;font-size:14px;padding:3px 5px;border-radius:6px;transition:background .15s}
.btn-icon:active{background:var(--border)}

.add-doc-row{padding:10px 16px}
.btn-add-doc{background:transparent;border:1px dashed var(--border);color:var(--muted);border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;width:100%;transition:border-color .15s,color .15s}
.btn-add-doc:hover{border-color:var(--accent);color:var(--accent)}

.btn-add-owner{width:100%;background:transparent;border:2px dashed var(--border);color:var(--muted);border-radius:16px;padding:16px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:border-color .15s,color .15s;margin-top:4px}
.btn-add-owner:hover{border-color:var(--accent);color:var(--accent)}

.fab{position:fixed;bottom:24px;right:20px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(59,130,246,0.45);cursor:pointer;z-index:20;transition:transform .15s}
.fab:active{transform:scale(0.93)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#1a2744;border:1px solid var(--border);border-radius:24px 24px 0 0;padding:20px 20px 40px;width:100%;max-width:520px;animation:slideUp .25s cubic-bezier(.32,.72,0,1)}
.modal-drag{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:18px;font-weight:800;margin-bottom:14px}
.field-label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;margin-top:14px}
.inp{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--text);font-family:inherit;outline:none;transition:border-color .2s;appearance:none;-webkit-appearance:none}
.inp:focus{border-color:var(--accent)}
select.inp option{background:#1e293b}
.modal-btns{display:flex;gap:10px;margin-top:20px}
.btn-save{flex:1;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-save:disabled{opacity:.35;cursor:not-allowed}
.btn-cancel{background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:12px;padding:14px 18px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-delete{background:rgba(239,68,68,0.1);color:#ef4444;border:1px solid rgba(239,68,68,0.25);border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}

/* Settings modal */
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.settings-label{font-size:14px;font-weight:600}
.settings-sub{font-size:12px;color:var(--muted);margin-top:2px}
.notif-status{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px}
.notif-on{background:rgba(34,197,94,0.15);color:#22c55e}
.notif-off{background:rgba(100,116,139,0.15);color:var(--muted)}

.c0{background:rgba(59,130,246,0.18)}
.c1{background:rgba(168,85,247,0.18)}
.c2{background:rgba(34,197,94,0.18)}
.c3{background:rgba(249,115,22,0.18)}
.c4{background:rgba(236,72,153,0.18)}
.c5{background:rgba(234,179,8,0.18)}
.c6{background:rgba(20,184,166,0.18)}
.c7{background:rgba(239,68,68,0.18)}

.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#22c55e;color:#fff;padding:10px 20px;border-radius:12px;font-weight:600;font-size:14px;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.3);white-space:nowrap;animation:fadeIn .2s ease}
.empty{text-align:center;padding:60px 20px;color:#475569}
.empty-icon{font-size:48px;margin-bottom:10px}
.empty-text{font-size:16px;font-weight:600;color:var(--muted)}
.empty-sub{font-size:13px;color:#334155;margin-top:5px}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="header-title">🗂️ Moje doklady</div>
    <div class="header-actions">
      <button class="btn-sm" id="btnSync" onclick="cloudLoad()">☁️ Sync</button>
      <button class="btn-sm" onclick="openSettings()">⚙️</button>
      <button class="btn-sm" onclick="exportData()">⬇</button>
      <label class="btn-sm" style="cursor:pointer;margin:0">⬆<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label>
    </div>
  </div>
  <div class="main-tabs">
    <div class="main-tab active" id="tab-people" onclick="switchTab('people')">👤 Lidé</div>
    <div class="main-tab" id="tab-cars" onclick="switchTab('cars')">🚗 Auta</div>
    <div class="main-tab" id="tab-houses" onclick="switchTab('houses')">🏠 Domy</div>
  </div>
</div>

<div class="content" id="content"></div>
<button class="fab" onclick="openOwnerForm()">+</button>

<div class="overlay" id="overlay" style="display:none" onclick="handleOverlayClick(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-drag"></div>
    <div class="modal-title" id="modalTitle"></div>
    <div id="modalBody"></div>
    <div class="modal-btns" id="modalBtns"></div>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────
const NOTIF_DAYS_DEFAULT = 30;

const TABS = {
  people: {
    label:"osoba", labelPl:"osob", emoji:"👤",
    emojis:["👱‍♀️","👱‍♂️","🧒","👶","🧓"],
    cats:[
      {id:"op",      label:"Občanský průkaz",  icon:"🆔"},
      {id:"passport",label:"Pas",              icon:"✈️"},
      {id:"drivers", label:"Řidičský průkaz",  icon:"🏎️"},
      {id:"health",  label:"Zdravotní průkaz", icon:"💊"},
      {id:"other",   label:"Jiné",             icon:"📄"},
    ],
    maxItems:5,
    namePlaceholder:"Např. Jana Nováková",
    notePlaceholder:"Datum narození, rodné číslo...",
  },
  cars: {
    label:"auto", labelPl:"aut", emoji:"🚗",
    emojis:["🔑","🛻","🚘","🏁","⛽"],
    cats:[
      {id:"stz",      label:"Technická prohlídka",icon:"🔩"},
      {id:"insurance",label:"Pojištění vozidla",  icon:"📑"},
      {id:"vignette", label:"Dálniční nálepka",   icon:"🏷️"},
      {id:"emission", label:"Emisní kontrola",     icon:"🌿"},
      {id:"other",    label:"Jiné",               icon:"📄"},
    ],
    maxItems:10,
    namePlaceholder:"Např. Škoda Octavia · 1AB 2345",
    notePlaceholder:"Rok výroby, VIN...",
  },
  houses: {
    label:"dům/byt", labelPl:"nemovitostí", emoji:"🏠",
    emojis:["🔑","🪟","🚪","🏛️","🌳"],
    cats:[
      {id:"ins_build",label:"Pojištění nemovitosti",          icon:"🏠"},
      {id:"ins_home", label:"Pojištění domácnosti",           icon:"🪑"},
      {id:"ins_liab", label:"Pojištění odpovědnosti",         icon:"📋"},
      {id:"rev_elec", label:"Revize elektřiny",               icon:"🔌"},
      {id:"rev_gas",  label:"Revize plynu",                   icon:"🫙"},
      {id:"rev_chim", label:"Revize komínu",                  icon:"🧱"},
      {id:"rev_lift", label:"Revize výtahu",                  icon:"⬆️"},
      {id:"rev_fire", label:"Revize hasicích přístrojů",      icon:"🚒"},
      {id:"energy",   label:"Průkaz energetické náročnosti",  icon:"🌡️"},
      {id:"warranty", label:"Záruka na stavbu / spotřebiče",  icon:"🏗️"},
      {id:"other",    label:"Jiné",                           icon:"📄"},
    ],
    maxItems:10,
    namePlaceholder:"Např. Rodinný dům · Krátká 5, Praha",
    notePlaceholder:"Adresa, číslo parcely, LV...",
  },
};

const COLORS=["c0","c1","c2","c3","c4","c5","c6","c7"];
const ST={
  expired:{color:"#ef4444",dot:"#ef4444",bg:"rgba(239,68,68,0.12)"},
  critical:{color:"#f97316",dot:"#f97316",bg:"rgba(249,115,22,0.12)"},
  warning: {color:"#eab308",dot:"#eab308",bg:"rgba(234,179,8,0.12)"},
  ok:      {color:"#22c55e",dot:"#22c55e",bg:"rgba(34,197,94,0.12)"},
};

// ── State ─────────────────────────────────────────────────────────────────
const CLOUD_URL="https://script.google.com/macros/s/AKfycbxxLuMJLVE4f6QZ8lWF7Cn4cHocZGnDgSMqcnuU6EMkQlW3sZ0MTAWuqN-ZJxpN-znfCQ/exec";
let state={people:[],cars:[],houses:[]};
let settings={notifDays:NOTIF_DAYS_DEFAULT, notifEnabled:false, bannerDismissed:false};
let tab="people";
let expanded=new Set();
let syncing=false;

// ── Persistence ───────────────────────────────────────────────────────────
function load(){
  try{
    const s=localStorage.getItem("doklady-v3");
    if(s){const d=JSON.parse(s);state.people=d.people||[];state.cars=d.cars||[];state.houses=d.houses||[];}
  }catch{}
  try{
    const s=localStorage.getItem("doklady-settings");
    if(s)settings={...settings,...JSON.parse(s)};
  }catch{}
}
function persist(){
  localStorage.setItem("doklady-v3",JSON.stringify(state));
  cloudSave();
}

async function cloudSave(){
  if(syncing)return;syncing=true;setSyncStatus("syncing");
  try{
    const r=await fetch(CLOUD_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(state)});
    setSyncStatus("ok");
  }catch(e){console.log("save err",e);setSyncStatus("err");}
  syncing=false;
}

async function cloudLoad(){
  if(syncing)return;syncing=true;setSyncStatus("syncing");
  try{
    const r=await fetch(CLOUD_URL+"?t="+Date.now(),{mode:"cors"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json();
    if(d&&d.people!==undefined){
      state.people=d.people||[];state.cars=d.cars||[];state.houses=d.houses||[];
      localStorage.setItem("doklady-v3",JSON.stringify(state));
      render();
    }
    setSyncStatus("ok");
  }catch(e){console.log("load err",e);setSyncStatus("err");}
  syncing=false;
}

function setSyncStatus(s){
  const btn=document.getElementById("btnSync");if(!btn)return;
  if(s==="syncing"){btn.textContent="☁️ Ukládám…";btn.style.color="#60a5fa";}
  else if(s==="ok"){btn.textContent="☁️ OK";btn.style.color="#22c55e";setTimeout(()=>{btn.textContent="☁️ Sync";btn.style.color="";},2500);}
  else if(s==="err"){btn.textContent="☁️ Chyba";btn.style.color="#ef4444";setTimeout(()=>{btn.textContent="☁️ Sync";btn.style.color="";},3000);}
  else{btn.textContent="☁️ Sync";btn.style.color="";}
}
function persistSettings(){localStorage.setItem("doklady-settings",JSON.stringify(settings));}

// ── Helpers ───────────────────────────────────────────────────────────────
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function daysLeft(d){const t=new Date();t.setHours(0,0,0,0);const e=new Date(d);e.setHours(0,0,0,0);return Math.round((e-t)/86400000);}
function status(d){if(d<0)return"expired";if(d<=30)return"critical";if(d<=90)return"warning";return"ok";}
function daysLabel(d){if(d<0)return`Vypršelo před ${Math.abs(d)} dny`;if(d===0)return"Vyprší dnes!";if(d===1)return"Zbývá 1 den";if(d<5)return`Zbývají ${d} dny`;return`Zbývá ${d} dní`;}
function fmtDate(d){return new Date(d).toLocaleDateString("cs-CZ",{day:"numeric",month:"short",year:"numeric"});}
function getCat(cats,id){return cats.find(c=>c.id===id)||cats[cats.length-1];}
function worstStatus(docs){
  const order=["expired","critical","warning","ok"];
  for(const s of order){if(docs.some(d=>status(daysLeft(d.expiryDate))===s))return s;}
  return null;
}
function getArr(){return tab==="people"?state.people:tab==="cars"?state.cars:state.houses;}
function getAllDocs(){
  const all=[];
  ["people","cars","houses"].forEach(k=>{
    const cfg=TABS[k];
    state[k].forEach(owner=>{
      owner.docs.forEach(doc=>{
        const cat=getCat(cfg.cats,doc.category);
        all.push({ownerName:owner.name, docLabel:cat.label, icon:cat.icon, expiryDate:doc.expiryDate, days:daysLeft(doc.expiryDate)});
      });
    });
  });
  return all;
}

// ── Notifications ─────────────────────────────────────────────────────────
function notifSupported(){return"Notification" in window;}
function notifGranted(){return Notification.permission==="granted";}

async function requestNotifPermission(){
  if(!notifSupported())return false;
  const result=await Notification.requestPermission();
  if(result==="granted"){
    settings.notifEnabled=true;
    settings.bannerDismissed=true;
    persistSettings();
    registerServiceWorker();
    checkAndNotify(true);
    return true;
  }
  return false;
}

function registerServiceWorker(){
  if(!("serviceWorker" in navigator))return;
  // Inline service worker as blob
  const swCode=`
    self.addEventListener('install',e=>self.skipWaiting());
    self.addEventListener('activate',e=>clients.claim());
    self.addEventListener('message',e=>{
      if(e.data&&e.data.type==='NOTIFY'){
        e.data.items.forEach(item=>{
          self.registration.showNotification('🗂️ Moje doklady', {
            body: item.body,
            icon: item.icon||'',
            badge: '',
            tag: item.tag,
            renotify: false,
          });
        });
      }
    });
  `;
  const blob=new Blob([swCode],{type:"application/javascript"});
  const url=URL.createObjectURL(blob);
  navigator.serviceWorker.register(url).catch(()=>{});
}

async function checkAndNotify(force=false){
  if(!notifGranted()||!settings.notifEnabled)return;
  // Throttle: max once per day unless forced
  const lastCheck=localStorage.getItem("doklady-lastNotif");
  const today=new Date().toDateString();
  if(!force && lastCheck===today)return;
  localStorage.setItem("doklady-lastNotif",today);

  const threshold=settings.notifDays||NOTIF_DAYS_DEFAULT;
  const urgent=getAllDocs().filter(d=>d.days>=0&&d.days<=threshold).sort((a,b)=>a.days-b.days);
  const expired=getAllDocs().filter(d=>d.days<0);

  const items=[];
  if(expired.length){
    items.push({
      body:`⛔ ${expired.map(d=>`${d.ownerName} — ${d.docLabel}`).join(", ")} — expirováno!`,
      tag:"expired",
    });
  }
  if(urgent.length){
    urgent.slice(0,5).forEach(d=>{
      items.push({
        body:`${d.icon} ${d.ownerName} — ${d.docLabel}: ${daysLabel(d.days)}`,
        tag:`doc-${d.ownerName}-${d.docLabel}`,
      });
    });
  }

  if(!items.length)return;

  // Try via SW first, fallback to direct
  if("serviceWorker" in navigator){
    navigator.serviceWorker.ready.then(reg=>{
      if(reg.active){
        reg.active.postMessage({type:"NOTIFY",items});
      } else {
        items.forEach(item=>new Notification("🗂️ Moje doklady",{body:item.body,tag:item.tag}));
      }
    }).catch(()=>{
      items.forEach(item=>new Notification("🗂️ Moje doklady",{body:item.body,tag:item.tag}));
    });
  } else {
    items.forEach(item=>new Notification("🗂️ Moje doklady",{body:item.body,tag:item.tag}));
  }
}

function dismissBanner(){
  settings.bannerDismissed=true;
  persistSettings();
  render();
}

// ── Tab switch ────────────────────────────────────────────────────────────
function switchTab(t){
  tab=t;
  ["people","cars","houses"].forEach(k=>document.getElementById("tab-"+k).classList.toggle("active",k===t));
  render();
}

// ── Render ────────────────────────────────────────────────────────────────
function render(){
  const cfg=TABS[tab];
  const items=getArr();
  let totalDocs=0,urgent=0;
  items.forEach(item=>{
    totalDocs+=item.docs.length;
    item.docs.forEach(d=>{const s=status(daysLeft(d.expiryDate));if(s==="expired"||s==="critical")urgent++;});
  });

  let h="";

  // Notification banner
  if
